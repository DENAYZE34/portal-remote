name: Portal iOS build
'on':
  workflow_dispatch: null
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.9
  FLUTTER_ELINUX_VERSION: 3.16.9
  TAG_NAME: ${{ inputs.upload-tag }}
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.5.0
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: 'true'
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  build-rustdesk-ios:
    name: build rustdesk ios ipa
    runs-on: ${{ matrix.job.os }}
    needs:
    - generate-bridge
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-apple-ios
          os: macos-latest
          vcpkg-triplet: arm64-ios
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Install dependencies
      run: 'brew install nasm yasm

        '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch flutter
      run: "cd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.FLUTTER_VERSION}} ]]; then\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\n\
        fi\n"
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while\
        \ read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet\
        \ }}-rel-out.log\" || true\n"
      shell: bash
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-ios
        key: ${{ matrix.job.target }}
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Build rustdesk lib
      run: 'rustup target add ${{ matrix.job.target }}

        cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

        '
    - name: Upload liblibrustdesk.a Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: liblibrustdesk.a
        path: target/aarch64-apple-ios/release/liblibrustdesk.a
    - name: Build rustdesk
      shell: bash
      run: 'pushd flutter

        # flutter build ipa --release --obfuscate --split-debug-info=./split-debug-info --no-codesign

        # for easy debugging

        flutter build ipa --release --no-codesign

        '
    - name: Package unsigned ipa
      shell: bash
      run: 'cd flutter/build/ios/archive/Runner.xcarchive/Products/Applications

        APP=Runner.app

        ICONS="$GITHUB_WORKSPACE/flutter/ios/Runner/Assets.xcassets/AppIcon.appiconset"

        cp "$ICONS/Icon-App-60x60@2x.png" "$APP/AppIcon60x60@2x.png"

        cp "$ICONS/Icon-App-60x60@3x.png" "$APP/AppIcon60x60@3x.png"

        cp "$ICONS/Icon-App-76x76@2x.png" "$APP/AppIcon76x76@2x~ipad.png"

        cp "$ICONS/Icon-App-83.5x83.5@2x.png" "$APP/AppIcon83.5x83.5@2x~ipad.png"

        PB=/usr/libexec/PlistBuddy

        P="$APP/Info.plist"

        $PB -c "Add :CFBundleIcons dict" "$P"

        $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$P"

        $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$P"

        $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$P"

        $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$P"

        $PB -c "Add :CFBundleIcons~ipad dict" "$P"

        $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon dict" "$P"

        $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles array" "$P"

        $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon76x76" "$P"

        $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:1 string AppIcon83.5x83.5" "$P"

        $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$P"

        mkdir -p /tmp/ipa/Payload && cp -R "$APP" /tmp/ipa/Payload/

        cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/Portal-unsigned.ipa" Payload

        unzip -l "$GITHUB_WORKSPACE/Portal-unsigned.ipa" | grep -i AppIcon'
    - name: Upload ipa
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: portal-ios-unsigned
        path: Portal-unsigned.ipa
