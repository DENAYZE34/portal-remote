name: Portal iOS12 build
'on':
  workflow_dispatch: null
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.9
  FLUTTER_ELINUX_VERSION: 3.16.9
  TAG_NAME: ${{ inputs.upload-tag }}
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.5.0
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: 'true'
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  build-rustdesk-ios:
    name: build rustdesk ios ipa
    runs-on: ${{ matrix.job.os }}
    needs:
    - generate-bridge
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-apple-ios
          os: macos-latest
          vcpkg-triplet: arm64-ios
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Install dependencies
      run: 'brew install nasm yasm

        '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Lower iOS deployment target to 12.0
      run: |
        sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 12.0/' flutter/ios/Runner.xcodeproj/project.pbxproj
        sed -i '' "s/platform :ios, '13.0'/platform :ios, '12.0'/" flutter/ios/Podfile
    - name: Check branding
      run: bash .github/scripts/check-branding.sh
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch flutter
      run: "cd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.FLUTTER_VERSION}} ]]; then\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
      shell: bash
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-ios
        key: ${{ matrix.job.target }}
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Build rustdesk lib
      run: 'rustup target add ${{ matrix.job.target }}

        cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

        '
    - name: Upload liblibrustdesk.a Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: liblibrustdesk.a
        path: target/aarch64-apple-ios/release/liblibrustdesk.a
    - name: Build rustdesk
      shell: bash
      run: 'pushd flutter

        # flutter build ipa --release --obfuscate --split-debug-info=./split-debug-info --no-codesign

        # for easy debugging

        flutter build ipa --release --no-codesign --build-name 1.5.${{ github.run_number }} --build-number ${{ github.run_number }} "--dart-define=DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}"

        '
    - name: Package unsigned ipa
      shell: bash
      run: 'cd flutter/build/ios/archive/Runner.xcarchive/Products/Applications

        ls Runner.app | grep -i -E "Assets.car|AppIcon" || true

        mkdir -p /tmp/ipa/Payload && cp -R Runner.app /tmp/ipa/Payload/

        cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/Portal-ios12.ipa" Payload'
    - name: Upload ipa
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: portal-ios12
        path: Portal-ios12.ipa
    - name: Write SideStore source
      shell: bash
      run: "SIZE=$(stat -f%z Portal-ios12.ipa)\nDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)\ncat > apps.json <<EOF\n{\n  \"name\": \"Portal\",\n  \"identifier\": \"com.portalremote.source\",\n  \"apps\": [{\n    \"name\": \"Portal\",\n    \"bundleIdentifier\": \"com.portalremote.app\",\n    \"developerName\": \"Portal\",\n    \"subtitle\": \"Remote desktop\",\n    \"localizedDescription\": \"Portal remote desktop client\",\n    \"iconURL\": \"https://raw.githubusercontent.com/DENAYZE34/portal-remote/main/res/icon.png\",\n    \"version\": \"1.5.${{ github.run_number }}\",\n    \"versionDate\": \"$DATE\",\n    \"downloadURL\": \"https://github.com/DENAYZE34/portal-remote/releases/download/ios12-latest/Portal-ios12.ipa\",\n    \"size\": $SIZE\n  }]\n}\nEOF\ncat apps.json"
    - name: Publish iOS release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        tag_name: ios12-latest
        name: Portal iOS 12 (latest)
        prerelease: true
        make_latest: 'false'
        files: 'Portal-ios12.ipa

          apps.json'
    permissions:
      contents: write
