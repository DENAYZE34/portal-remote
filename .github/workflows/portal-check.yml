name: Portal check
'on':
  workflow_dispatch: null
  push:
    paths:
      - flutter/lib/mobile/voice/**
      - flutter/test/deepgram_transcript_test.dart
      - flutter/test/cert_pin_test.dart
      - flutter/test/thumb_keys_test.dart
      - flutter/test/update_check_test.dart
      - src/pairing.rs
      - flutter/test/auto_reconnect_test.dart
      - flutter/test/zoom_logic_test.dart
      - flutter/lib/mobile/zoom_logic.dart
      - flutter/lib/mobile/widgets/zoom_widgets.dart
      - flutter/test/deepgram_replay_test.dart test/zoom_logic_test.dart
      - flutter/test/fixtures/**
      - flutter/test/quality_preset_test.dart
      - flutter/lib/mobile/quality_preset.dart
      - flutter/lib/mobile/auto_reconnect.dart
      - flutter/lib/mobile/stability.dart
      - flutter/lib/mobile/update_check.dart
      - flutter/lib/mobile/update_logic.dart
      - flutter/lib/mobile/widgets/ring_config.dart
      - src/client.rs
      - .github/workflows/portal-check.yml
jobs:
  voice-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.5
      - name: Test pairing policy (Rust, std only)
        run: |
          rustc --edition 2021 --test src/pairing.rs -o /tmp/pairing_test
          /tmp/pairing_test
      - name: Get packages
        working-directory: flutter
        run: flutter pub get
      - name: Analyze voice code
        working-directory: flutter
        run: flutter analyze --no-fatal-infos lib/mobile/voice lib/mobile/widgets/ring_config.dart lib/mobile/widgets/thumb_tools.dart lib/mobile/update_check.dart lib/mobile/update_logic.dart lib/mobile/auto_reconnect.dart lib/mobile/stability.dart lib/mobile/quality_preset.dart lib/mobile/widgets/voice_toggle.dart lib/mobile/widgets/zoom_widgets.dart lib/mobile/zoom_logic.dart lib/mobile/pages/home_page.dart test/deepgram_transcript_test.dart test/cert_pin_test.dart test/thumb_keys_test.dart test/update_check_test.dart test/auto_reconnect_test.dart test/quality_preset_test.dart test/deepgram_replay_test.dart test/zoom_logic_test.dart
      - name: Run voice tests
        working-directory: flutter
        run: flutter test --timeout 60s test/deepgram_transcript_test.dart test/cert_pin_test.dart test/thumb_keys_test.dart test/update_check_test.dart test/auto_reconnect_test.dart test/quality_preset_test.dart test/deepgram_replay_test.dart test/zoom_logic_test.dart
